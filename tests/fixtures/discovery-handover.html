<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discovery handover component review</title>
<link rel="stylesheet" href="../../playable-3d/exploration-tools.css"><link rel="stylesheet" href="../../playable-3d/helper-picker.css"><link rel="stylesheet" href="../../playable-3d/echo-guide.css">
<style>*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui;background:#edf1e7;color:#173d38}header#header{background:#fffaf0;padding:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #93a99b}button{font:inherit;padding:9px 12px;min-height:44px;border:1px solid #567b6d;border-radius:8px;background:#fffaf0;color:#173d38;cursor:pointer}button:focus-visible{outline:3px solid #ad5c17;outline-offset:3px}main{padding:24px;max-width:700px}#review-note{font-size:13px}#world{width:100%;height:170px;background:#d8e5d2;border:1px solid #abc0ac;border-radius:18px}.echo-dialogue{position:fixed;top:150px}#helper-picker{max-height:calc(100dvh - 20px);overflow:auto}#helper-picker[open]{max-width:calc(100vw - 20px)}#guidance[hidden]{display:none!important}</style>
<header id="header"><strong>CAREER EMPIRE</strong><button id="help">Help</button><button id="choose">Optional companion</button><button id="hide" hidden>Hide companion</button></header><main id="experience"><p id="review-note">Component review · synthetic discovery save · campus assets unavailable</p><h1>Your next experience</h1><canvas id="world" tabindex="0" aria-label="Gameplay focus target"></canvas><p id="travel-state" role="status">Exploring campus</p><button id="complete">Review discovery finish</button></main>
<section id="guidance" class="echo-dialogue" hidden><header><span data-name></span><button id="close-help" aria-label="Close guidance">×</button></header><small data-count></small><h2 tabindex="-1"></h2><p data-message></p><div data-revisit></div><p data-note></p><button data-action></button><footer><button data-back>Back</button><button data-skip>Skip</button><button data-next>Next</button></footer></section>
<script type="module">
import {createJourneyStore,createDiscoveryHandover} from '../../playable-3d/discovery-handover.mjs';
import {createExplorationTools} from '../../playable-3d/exploration-tools.mjs';
import {createHelperPicker} from '../../playable-3d/helper-picker.js';
import {renderContextGuidance} from '../../playable-3d/context-guidance.mjs';
const $=id=>document.getElementById(id),image=document.createElement('canvas');image.width=240;image.height=160;const ctx=image.getContext('2d');ctx.fillStyle='#40755e';ctx.fillRect(0,0,240,160);ctx.fillStyle='#f2d086';ctx.beginPath();ctx.arc(120,70,40,0,7);ctx.fill();ctx.font='16px system-ui';ctx.fillText('Synthetic saved photo',25,145);
const state={step:4,chapelVisited:true,shots:{chapel:{label:'Chapel',image:image.toDataURL('image/jpeg')},mural:{label:'Mural',image:image.toDataURL('image/jpeg')}},souvenir:image.toDataURL('image/png')};
const journey=createJourneyStore(localStorage);journey.bank(state);let travelCount=0,failTravel=false,paused=false;
const travel=async()=>{travelCount++;if(failTravel)throw Error('Test travel unavailable');$('travel-state').textContent='At safe market entrance: 43, -17.8';};
const handover=createDiscoveryHandover({journey,header:$('header'),goMarket:travel,pause:()=>paused=true,resume:()=>{paused=false;$('world').focus();}});
const picker=createHelperPicker({storage:localStorage,profile:()=> 'component-review',onChange:()=>{$('hide').hidden=!picker.selected().model;renderHelp();}});
function renderHelp(){renderContextGuidance($('guidance'),state,picker.selected());$('guidance').querySelector('[data-name]').textContent=picker.selected().model?picker.selected().name+' · YOUR WORLD GUIDE':'HELP · YOUR NEXT STEPS';}
$('choose').onclick=()=>picker.choose(true);$('hide').onclick=()=>{const hidden=!picker.store.hidden('component-review');picker.store.setHidden('component-review',hidden);$('hide').textContent=hidden?'Show companion':'Hide companion';};$('help').onclick=()=>{renderHelp();$('guidance').hidden=false;$('guidance').querySelector('h2').focus();};$('close-help').onclick=()=>{$('guidance').hidden=true;$('world').focus();};$('guidance').addEventListener('keydown',e=>{if(e.key==='Escape')$('close-help').click();});$('complete').onclick=()=>handover.show();
// Stats component needs only a world container, not renderer/physics, in this fixture.
class Node{constructor(){this.position={set(){}};this.rotation={};}add(){}}const T={Group:Node,MeshStandardMaterial:Node,Mesh:Node,BoxGeometry:Node};
const tools=createExplorationTools({THREE:T,worlds:{town:new Node()},position:()=>({x:0,z:0}),mode:()=> 'town',state:()=>state,header:$('header'),storage:localStorage,journey,photo:()=>state.souvenir,routeMarket:travel});
window.review={journey,handover,tools,picker,state,fail(value){failTravel=value;},snapshot:()=>({travelCount,paused,...handover.snapshot()})};handover.update();
</script></html>
