<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Vault Bridge correct burst</title>
  <desc id="desc">A bright success burst for a correct glossary answer.</desc>
  <defs>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#84ffd1"/>
      <stop offset="0.55" stop-color="#64f4ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#64f4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="burst-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="180" cy="180" r="150" fill="url(#burst)"/>
  <g filter="url(#burst-glow)" stroke-linecap="round">
    <circle cx="180" cy="180" r="82" fill="none" stroke="#84ffd1" stroke-width="9"/>
    <circle cx="180" cy="180" r="118" fill="none" stroke="#64f4ff" stroke-width="5" stroke-dasharray="18 18"/>
    <path d="M180 28V94M180 266v66M28 180H94M266 180h66M72 72l46 46M242 242l46 46M288 72l-46 46M118 242l-46 46" stroke="#ffd86c" stroke-width="10"/>
    <path d="M129 180 L164 214 L236 132" fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="round"/>
  </g>
</svg>
