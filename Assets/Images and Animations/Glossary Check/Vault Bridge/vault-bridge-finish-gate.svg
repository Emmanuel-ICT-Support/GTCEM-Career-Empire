<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-labelledby="title desc">
  <title id="title">Vault Bridge finish gate</title>
  <desc id="desc">A glowing finish gate that pays salary and tax rewards after a crossing.</desc>
  <defs>
    <radialGradient id="gate-core" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#ffd86c" stop-opacity="0.6"/>
      <stop offset="0.42" stop-color="#84ffd1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#071227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gate-edge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd86c"/>
      <stop offset="0.46" stop-color="#84ffd1"/>
      <stop offset="1" stop-color="#64f4ff"/>
    </linearGradient>
    <filter id="gate-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="260" cy="260" r="232" fill="url(#gate-core)"/>
  <g filter="url(#gate-glow)">
    <rect x="112" y="78" width="296" height="360" rx="92" fill="#091633" stroke="url(#gate-edge)" stroke-width="10"/>
    <rect x="156" y="126" width="208" height="266" rx="70" fill="none" stroke="#84ffd1" stroke-width="6" stroke-dasharray="16 18"/>
    <circle cx="260" cy="258" r="72" fill="#ffd86c" opacity="0.16"/>
    <path d="M210 260 H310" stroke="#ffd86c" stroke-width="13" stroke-linecap="round"/>
    <path d="M260 210 V310" stroke="#ffd86c" stroke-width="13" stroke-linecap="round"/>
    <circle cx="128" cy="126" r="34" fill="#102a54" stroke="#84ffd1" stroke-width="5"/>
    <circle cx="392" cy="126" r="34" fill="#102a54" stroke="#84ffd1" stroke-width="5"/>
    <circle cx="128" cy="394" r="34" fill="#102a54" stroke="#84ffd1" stroke-width="5"/>
    <circle cx="392" cy="394" r="34" fill="#102a54" stroke="#84ffd1" stroke-width="5"/>
  </g>
  <g font-family="Outfit, Arial, sans-serif" text-anchor="middle" fill="#ffffff" font-weight="900">
    <text x="260" y="472" font-size="34">SALARY UNLOCK</text>
    <text x="128" y="134" font-size="16">TAX</text>
    <text x="392" y="134" font-size="15">SHOP</text>
    <text x="128" y="402" font-size="15">CLASS</text>
    <text x="392" y="402" font-size="14">GLOBAL</text>
  </g>
</svg>
