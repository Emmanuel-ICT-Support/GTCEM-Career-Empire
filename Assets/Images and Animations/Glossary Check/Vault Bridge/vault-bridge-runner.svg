<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" role="img" aria-labelledby="title desc">
  <title id="title">Vault Bridge runner character</title>
  <desc id="desc">A stylized student runner in a futuristic recall suit.</desc>
