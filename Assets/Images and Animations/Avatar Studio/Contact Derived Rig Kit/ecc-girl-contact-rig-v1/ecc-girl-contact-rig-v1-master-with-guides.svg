    <text x="40" y="56" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#102033">ECC girl contact-derived rig v1</text>
    <text x="40" y="88" font-family="Arial, sans-serif" font-size="18" fill="#526174">Full canvas: 1024 x 1536. Open this SVG in Illustrator; keep exported layers on the same canvas.</text>
    <text x="40" y="1416" font-family="Arial, sans-serif" font-size="18" fill="#102033">Uses the actual contact-sheet girl artwork as the visual source.</text>
<text x="40" y="1440" font-family="Arial, sans-serif" font-size="18" fill="#102033">The supplied sheets do not include a clean neutral full-body girl base; this is a full uniform reference rig.</text>
<text x="40" y="1464" font-family="Arial, sans-serif" font-size="18" fill="#102033">A neutral girl body/base layer is still required before true clothing swaps will be clean.</text>
