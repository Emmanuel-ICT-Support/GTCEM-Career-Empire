    <text x="40" y="56" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#102033">ECC boy contact-derived rig v1</text>
    <text x="40" y="88" font-family="Arial, sans-serif" font-size="18" fill="#526174">Full canvas: 1024 x 1536. Open this SVG in Illustrator; keep exported layers on the same canvas.</text>
    <text x="40" y="1416" font-family="Arial, sans-serif" font-size="18" fill="#102033">Uses the actual contact-sheet boy artwork as the visual source.</text>
<text x="40" y="1440" font-family="Arial, sans-serif" font-size="18" fill="#102033">Includes both the full uniform reference and the supplied neutral body guide.</text>
<text x="40" y="1464" font-family="Arial, sans-serif" font-size="18" fill="#102033">Use the uniform reference for clothing alignment; use the body guide only as a base-body placeholder.</text>
