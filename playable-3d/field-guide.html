<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Empire · Field guide</title><link rel="stylesheet" href="./learning-resources.css"><style>body{margin:0;padding:24px;background:#edf0e7}main,.learning-top,footer{max-width:960px;margin:auto}footer{margin-top:32px}a{color:#17554e}</style></head><body><nav class="learning-top" aria-label="Field guides"><a href="?topic=initiative">Initiative</a><a href="?topic=opportunities">Opportunities</a><a href="?topic=megatrends">Changing world</a><a href="?topic=adaptation">Work trials</a><a href="?topic=applications">Applications</a><button id="print">Print guide</button></nav><main id="guide"></main><footer><a href="./?experience=sunday-markets">Return to the Market</a><p>Original teaching guides for fictional practice. Opening a guide or answering a check is not a grade or proof of workplace competence.</p></footer><script type="module">

const requested=new URLSearchParams(location.search).get('topic'),id=Object.hasOwn(RESOURCES,requested)?requested:'opportunities',r=RESOURCES[id];document.title=r.title+' · Career Empire';const main=document.getElementById('guide');main.append(resourceElement(id));const section=document.createElement('section');section.className='learning-check';const title=document.createElement('h2');title.textContent='Try a quick check';const prompt=document.createElement('p');prompt.textContent=r.check.prompt;const feedback=document.createElement('p');feedback.setAttribute('role','status');section.append(title,prompt);r.check.options.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{feedback.textContent=r.check.feedback[i]+(i===r.check.answer?' Try explaining why a different answer would mislead someone.':' Revisit the guide, then try again.');};section.append(b);});section.append(feedback);main.append(section);document.getElementById('print').onclick=()=>window.print();
</script></body></html>
