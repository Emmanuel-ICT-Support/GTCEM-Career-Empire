name: Suit shadow diagnostic (not release qualification)

# Install on a separate diagnostic branch based on the failing source commit.
# Existing ci.yml and required Ubuntu checks are intentionally unchanged.
# Standard macos-15 only: no paid xlarge runner or persistent registration.
'on':
  push:
    branches: ['diagnostic/suit-shadow-e657a1e']

permissions:
  contents: read

jobs:
  suit-shadow-diagnostic:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python for the local test server
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify and warm the exact server interpreter
        shell: bash
        run: |
          mkdir -p coverage/suit-diagnostic
          {
            command -v python3
            python3 --version
            python3 -c "import sys, http.server, pathlib, re, socket; assert sys.version_info[:2] == (3, 12); print(sys.executable); print('Server standard-library dependencies ready')"
          } 2>&1 | tee coverage/suit-diagnostic/python-environment.txt
      - name: Install dependencies
        run: npm ci
      - name: Install the same Playwright browser as CI
        run: npx playwright install chromium
      - name: Record environment and source revision
        shell: bash
        run: |
          mkdir -p coverage/suit-diagnostic
          {
            git rev-parse HEAD
            git status --short
            uname -a
            node --version
            npm --version
            npx playwright --version
          } 2>&1 | tee coverage/suit-diagnostic/environment.txt
      - name: Require a native Apple Metal browser backend
        run: |
          mkdir -p coverage/suit-diagnostic
          system_profiler SPDisplaysDataType > coverage/suit-diagnostic/mac-graphics.txt
          node scripts/probe-suit-native.mjs
      - name: Profile the two unchanged walking-shadow tests
        shell: bash
        env:
          DEBUG: pw:webserver
          PYTHONUNBUFFERED: '1'
          CE_SUIT_PROFILE: '1'
          CE_SUIT_STAGES: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: coverage/suit-diagnostic/browser-report.json
        run: |
          set -o pipefail
          npx playwright test --config playwright.suit-diagnostic.config.mjs tests/e2e/suit-flicker.spec.js \
            --grep "playable suit shadows follow every walking frame" \
            --project=chromium --workers=1 --retries=0 --max-failures=0 \
            --reporter=line,json \
            2>&1 | tee coverage/suit-diagnostic/console.log
      - name: Verify the actual game used native Metal at both widths
        if: always()
        run: node scripts/probe-suit-native.mjs --verify-game
      # CE_SUIT_PROFILE captures the existing 1280px native trace SUMMARY.
      # Both widths log frame timing; full Playwright tracing remains off,
      # matching CI and avoiding an extra tracing variable in this comparison.
      - name: Preserve evidence even if a test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suit-shadow-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 3
