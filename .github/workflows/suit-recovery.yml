name: Two-case suit rendering diagnostic
run-name: Mesa software renderer comparison 10 at ${{ github.sha }}
'on':
  push:
    branches: [repair/targeted-recovery-20261015]
    paths: ['.github/workflows/suit-recovery.yml']
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CE_MESA_COMPARE: '1'
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci && npm run check
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y mesa-utils libgl1-mesa-dri
      - run: xvfb-run -a glxinfo -B
      - run: mkdir -p coverage && npx playwright test tests/e2e/suit-flicker.spec.js tests/e2e/static-batching.spec.js --grep 'playable suit shadows|static batches retain' --list --reporter=json > coverage/selected-inventory.json
      - run: xvfb-run -a npx playwright test tests/e2e/suit-flicker.spec.js tests/e2e/static-batching.spec.js --grep 'playable suit shadows|static batches retain' --workers=1 --retries=0 --reporter=line,json
        env: {PLAYWRIGHT_JSON_OUTPUT_FILE: coverage/browser-report.json, CE_SUIT_PROFILE: '0', CE_RUNNER_PROFILE: '1'}
      - if: always()
        run: node scripts/focused-repair-report.mjs coverage/selected-inventory.json coverage/browser-report.json coverage/focused-summary.json
        env: {EXPECTED_CASES: 3}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: suit-probe, path: coverage/, retention-days: 3}
