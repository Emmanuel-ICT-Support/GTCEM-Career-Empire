name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source checks and unit coverage once
        run: npm run check && npm run coverage && node --test scripts/ci-shard-proof.test.mjs

      - name: Collect full browser inventory
        run: npx playwright test --list --reporter=json > coverage/browser-inventory.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 3

  critical:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate startup before student journeys
        run: npx playwright test --grep "real grass failure" --workers=1 --max-failures=0 --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: coverage/startup-report.json
      - name: Run essential student journeys after startup passes
        run: npx playwright test --grep "$CRITICAL_CASES" --grep-invert "real grass failure" --workers=1 --max-failures=0 --reporter=line,json
        env:
          CRITICAL_CASES: 'full natural intro|actual photo completion|same-run photo teachers|selected Sprout appears|actual keyboard walk through west Administration|real grass failure'
          PLAYWRIGHT_JSON_OUTPUT_FILE: coverage/critical-journey-report.json
      - name: Consolidate critical evidence even after startup failure
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const files=['coverage/startup-report.json','coverage/critical-journey-report.json'];
          const reports=files.filter(file=>fs.existsSync(file)).map(file=>JSON.parse(fs.readFileSync(file,'utf8')));
          const report={config:{shard:null},suites:reports.flatMap(r=>r.suites||[]),errors:reports.flatMap(r=>r.errors||[])};
          if(!reports.length)report.errors.push({message:'No critical execution report produced'});
          fs.mkdirSync('coverage',{recursive:true});fs.writeFileSync('coverage/browser-report.json',JSON.stringify(report));
          JS
      - name: Upload critical journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-critical
          path: coverage/
          if-no-files-found: warn
          retention-days: 3

  browser:
    needs: [checks, critical]
    if: needs.checks.result == 'success' && needs.critical.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser shard with one worker
        run: npx playwright test --grep-invert "$CRITICAL_CASES" --shard=${{ matrix.shard }}/4 --workers=1 --max-failures=0 --reporter=line,json
        env:
          CRITICAL_CASES: 'full natural intro|actual photo completion|same-run photo teachers|selected Sprout appears|actual keyboard walk through west Administration|real grass failure'
          PLAYWRIGHT_JSON_OUTPUT_FILE: coverage/browser-report.json

      - name: Upload unique shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-shard-${{ matrix.shard }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 3

  test:
    name: test
    needs: [checks, critical, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download full inventory
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-checks

      - name: Download unique shard reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: browser-evidence-*
          path: ci-evidence

      - name: Prove full coverage and consolidate outcomes
        if: always()
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CRITICAL_RESULT: ${{ needs.critical.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: node scripts/ci-shard-proof.mjs coverage-checks/browser-inventory.json ci-evidence coverage/browser-rollup.json

      - name: Upload consolidated count proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-count-proof
          path: coverage/browser-rollup.json
          if-no-files-found: warn
          retention-days: 3
